<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#07111f">
    <title>Pi Control wird aktualisiert</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center;
        overflow: hidden; color: #edf7ff;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif;
        background: #07111f;
      }
      body::before, body::after {
        content: ""; position: fixed; width: 34rem; height: 34rem;
        border-radius: 50%; filter: blur(90px); opacity: .38;
        animation: drift 9s ease-in-out infinite alternate;
      }
      body::before { background: #168cff; top: -14rem; left: -10rem; }
      body::after { background: #a96cff; right: -12rem; bottom: -16rem; animation-delay: -4s; }
      main {
        position: relative; width: min(92vw, 610px); padding: 3rem;
        border: 1px solid rgba(255,255,255,.14); border-radius: 32px;
        text-align: center; background: rgba(11,24,42,.72);
        box-shadow: 0 30px 90px rgba(0,0,0,.4); backdrop-filter: blur(22px);
      }
      .logo {
        width: 86px; height: 86px; margin: 0 auto 1.5rem; display: grid;
        place-items: center; border-radius: 26px; font-size: 42px;
        background: linear-gradient(135deg,#2196f3,#9178df);
        box-shadow: 0 16px 44px rgba(33,150,243,.32);
        animation: breathe 2.2s ease-in-out infinite;
      }
      .eyebrow { color: #87c9ff; font-weight: 750; letter-spacing: .12em; text-transform: uppercase; font-size: .78rem; }
      h1 { margin: .65rem 0 .8rem; font-size: clamp(2rem,6vw,3.25rem); line-height: 1.05; letter-spacing: -.045em; }
      p { margin: 0 auto; max-width: 30rem; color: #aebfd1; font-size: 1.05rem; line-height: 1.65; }
      .progress { height: 8px; margin: 2rem 0 1.1rem; overflow: hidden; border-radius: 99px; background: rgba(255,255,255,.08); }
      .progress span { display: block; width: 42%; height: 100%; border-radius: inherit; background: linear-gradient(90deg,#42b6ff,#b588ff); animation: loading 1.5s ease-in-out infinite; }
      small { color: #71869c; }
      @keyframes loading { from { transform: translateX(-120%); } to { transform: translateX(340%); } }
      @keyframes breathe { 50% { transform: translateY(-6px) scale(1.03); } }
      @keyframes drift { to { transform: translate(5rem,3rem) scale(1.15); } }
      @media (max-width: 520px) { main { padding: 2.2rem 1.4rem; border-radius: 26px; } }
    </style>
  </head>
  <body>
    <main>
      <div class="logo" aria-hidden="true">⚙</div>
      <div class="eyebrow">Pi Control</div>
      <h1>Gleich wieder da.</h1>
      <p>Pi Control wird gerade verbessert und aktualisiert. Du musst nichts tun – diese Seite öffnet die App automatisch, sobald alles fertig ist.</p>
      <div class="progress"><span></span></div>
      <small>Sicheres Update wird installiert …</small>
    </main>
    <script>
      setInterval(async () => {
        try {
          const response = await fetch('/api/auth/status', { cache: 'no-store' });
          if (response.ok) location.reload();
        } catch (_) {}
      }, 5000);
    </script>
  </body>
</html>
