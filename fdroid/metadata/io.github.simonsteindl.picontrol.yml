RepoType: git
Repo: https://github.com/SimonSteindl/pi-control.git

Builds:
  - versionName: '2.4.3'
    versionCode: 18
    commit: 360ba83e73d6e1ae326c18db19b92c6b85fb7ff1
    output: app/build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@3.47.0
    rm:
      - app/ios
      - app/linux
      - app/macos
      - app/web
      - app/windows
    build:
      - $$flutter$$/bin/flutter config --no-analytics
      - cd app && $$flutter$$/bin/flutter pub get --enforce-lockfile
      - cd app && $$flutter$$/bin/flutter build apk --release
