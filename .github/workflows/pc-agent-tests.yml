name: PC-Agent checks

on:
  pull_request:
    paths:
      - 'pc-agent/**'
      - 'pc_agent/**'
      - 'server/server.py'
      - '.github/workflows/pc-agent-tests.yml'
  push:
    branches: [main, feature/cross-platform-pc-agent, feature/pc-agent-autonomous-tasks]
    paths:
      - 'pc-agent/**'
      - '.github/workflows/pc-agent-tests.yml'

permissions:
  contents: read

jobs:
  agent-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check Python syntax
        run: python -m py_compile server/server.py pc-agent/agent.py pc-agent/local_api.py pc-agent/test_local_api.py pc-agent/test_task_runner.py pc_agent/task_runner.py
      - name: Smoke test
        run: |
          python pc-agent/agent.py info
          python pc-agent/agent.py status
          python pc-agent/agent.py serve --help
          python pc-agent/test_local_api.py
          python pc-agent/test_task_runner.py
      - name: Set up Flutter for app build
        if: hashFiles('app/pubspec.yaml') != ''
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          cache: true
      - name: Install Flutter app dependencies
        if: hashFiles('app/pubspec.yaml') != ''
        working-directory: app
        run: flutter pub get --enforce-lockfile
      - name: Build Android app
        if: hashFiles('app/pubspec.yaml') != ''
        working-directory: app
        run: flutter build apk --release
      - name: Upload Android APK
        if: hashFiles('app/pubspec.yaml') != ''
        uses: actions/upload-artifact@v4
        with:
          name: Pi-Control-APK
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
