name: Deploy public website to Cloudflare

on:
  push:
    branches: [main]
    paths:
      - 'server/public-site/**'
      - '.github/workflows/deploy-public-site.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-public-site
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate public website
        run: python3 server/public-site/test_site.py

      - name: Prepare only public assets
        run: |
          set -euo pipefail
          mkdir -p server/public-site/dist
          cp server/public-site/index.html server/public-site/robots.txt server/public-site/sitemap.xml server/public-site/dist/

      - name: Verify Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing GitHub secret CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing GitHub secret CLOUDFLARE_ACCOUNT_ID"; exit 1; }

      - name: Deploy public website
        working-directory: server/public-site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy
