name: Server memory tests

on:
  pull_request:
    paths:
      - 'server/**'
      - '.github/workflows/server-tests.yml'
  push:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/server-tests.yml'

permissions:
  contents: read

jobs:
  server-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install server test dependencies
        run: python -m pip install Flask Werkzeug
      - name: Check Python syntax
        run: python -m py_compile server/server.py server/pc_agent_bridge.py server/test_ai_memory.py server/test_pc_agent_bridge.py
      - name: Run AI memory and PC-Agent bridge tests
        run: |
          python server/test_ai_memory.py
          python server/test_pc_agent_bridge.py
