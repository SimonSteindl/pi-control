name: Build Android APK on Release

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/build-apk-release.yml'
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Configure Web platform
        run: flutter create . --platforms web

      - name: Build Web
        run: flutter build web --release

      - name: Save APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pi-Control-2.4.0-APK
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Save Web build as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pi-Control-2.4.0-Web
          path: app/build/web/**
          if-no-files-found: error

      - name: Upload APK to GitHub Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \\
            "build/app/outputs/flutter-apk/app-release.apk" \\
            --clobber \\
            --repo "${{ github.repository }}"
