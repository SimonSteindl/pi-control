name: Build Android APK on Release

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/build-apk-release.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/build-apk-release.yml'
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          cache: true

      - name: Install locked dependencies
        working-directory: app
        run: flutter pub get --enforce-lockfile

      - name: Build release APK
        working-directory: app
        run: flutter build apk --release

      - name: Save APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pi-Control-APK
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Upload APK to GitHub Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" "app/build/app/outputs/flutter-apk/app-release.apk" --clobber --repo "${{ github.repository }}"
