name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/build-apk-release.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/build-apk-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          cache: true

      - name: Install locked dependencies
        working-directory: app
        run: flutter pub get --enforce-lockfile

      - name: Build release APK
        working-directory: app
        run: flutter build apk --release

      - name: Save APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pi-Control-APK
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Publish APK as GitHub prerelease
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_NUMBER: ${{ github.run_number }}
          REPOSITORY: ${{ github.repository }}
        working-directory: app
        run: |
          APP_VERSION="$(sed -n 's/^version: *\([^+ ]*\).*/\1/p' pubspec.yaml | head -n 1)"
          if [ -z "$APP_VERSION" ]; then
            echo "Could not read app version from app/pubspec.yaml"
            exit 1
          fi

          RELEASE_TAG="v${APP_VERSION}-build.${RUN_NUMBER}"
          RELEASE_TITLE="Pi-Control ${APP_VERSION} (Build ${RUN_NUMBER})"

          gh release create "$RELEASE_TAG" "build/app/outputs/flutter-apk/app-release.apk" \
            --repo "$REPOSITORY" \
            --title "$RELEASE_TITLE" \
            --notes "Automatisch erstellter Vorab-Release aus dem main-Branch. Build: ${RUN_NUMBER}." \
            --prerelease
